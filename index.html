<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto HDS</title>

    <script type="module" src="assets/js/main.js"></script>
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <h1><a href="./">Projeto HDS</a></h1>
        <nav>

            </button>
            <form id="form_buscar">
                <input type="search" placeholder="Buscar">
                <button class="btn_nav" title="Buscar" aria-label="Buscar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/></svg>
                </button>
            </form>
        </nav>
    </header>

    <!-- Área Principal do App -->
    <main>
        <!-- Barra Lateral -->
        <aside id="barra_lateral_filtro" hidden>
            <h3>Setores</h3>
            <ul id="aside_lista_setores"></ul>
            <h3>Prioridade</h3>
            <ul id="aside_lista_prioridades"></ul>
            <h3>Status</h3>
            <ul id="aside_lista_status"></ul>
            <div id="aside_filtro_botoes">
                <button id="btn_limpar_filtro" title="Limpar Filtros" aria-label="Limpar Filtros">Limpar</button>
                <button id="btn_aplicar_filtro" title="Aplicar Filtros" aria-label="Aplicar Filtros">Aplicar</button>
            </div>
        </aside>

        <div id="area_principal">
            <section id="dashboard">
                <h2>Dashboard</h2>
                <div id="card_container">
                    <section class="card_info">
                        <h3>Solicitações em Aberto</h3>
                        <span id="num_em_aberto"></span>
                    </section>
                    <section class="card_info">
                        <h3>Setores Solicitantes</h3>
                        <canvas id="setores_solicitantes_chart"></canvas>
                    </section>
                    <section class="card_info">
                        <h3>Setores Requisitados</h3>
                        <canvas id="setores_requisitados_chart"></canvas>
                    </section>
                </div>
            </section>
            <section id="solicitacoes">
                <h2>Solicitações</h2>
                <ul id="lista_solicitacoes"></ul>
            </section>
            <section id="nova_solicitacao" hidden>
                <h3>Nova Solicitação</h3>
                <form id="form_nova_solicitacao">
                    <!-- Abertura de Chamado #AQUI -->
                </form>
            </section>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <small>&copy; 2026 Projeto HDS</small>
    </footer>
</body>
</html>
