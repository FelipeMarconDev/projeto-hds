<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto HDS</title>
    <link rel="icon" href="assets/icons/favicon.ico">
    <link rel="stylesheet" href="assets/css/style.css">
    <script type="module" src="assets/js/main.js"></script>
</head>
<body>
    <!-- Cabeçalho -->
    <header>
        <h1><a href="/">Projeto HDS</a></h1>

        </button>
        <button id="btn_dashboard" class="btn_nav" title="Dashboard" aria-label="Dashboard">

        </button>
        <form action="submit">
            <input id="input_buscar" type="search" required placeholder="Buscar">
            <button id="btn_buscar" class="btn_nav" title="Buscar" aria-label="Buscar">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/></svg>
            </button>
        </form>
    </nav>

    <!-- Barra Lateral -->
    <aside>
        <ul>
            <li data-filter="todos">Selecionar Todos</li>
            <li data-filter="comercial">Comercial</li>
            <li data-filter="administrativo">Administrativo</li>
            <li data-filter="financeiro">Financeiro</li>
            <li data-filter="estoque">Estoque</li>
            <li data-filter="suporte">Suporte Técnico</li>
            <li data-filter="infraestrutura">Infraestrutura</li>
            <li data-filter="instalacao">Instalação</li>
        </ul>
    </aside>

    <!-- Área Principal do App -->
    <main>
        <section id="dashboard">
            <h2>Dashboard</h2>
        </section>
        <section id="solicitacoes">
            <h2>Solicitações</h2>
            <ul id="lista_solicitacoes">
            </ul>
        </section>
        <section id="nova_solicitacao" hidden>
            <h3>Nova Solicitação</h3>
        </section>
    </main>

    <!-- Rodapé -->
    <footer>
        <small>&copy; 2026 Projeto HDS</small>
    </footer>
</body>
</html>
